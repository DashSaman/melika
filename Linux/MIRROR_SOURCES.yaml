    coverage: [ubuntu-jammy, ubuntu-noble, ubuntu-resolute]
    evidence_urls: [https://www.arvancloud.ir/fa/dev/linux-repository]
    evidence_status: DOCUMENTED
    routing_enabled: false
    notes: 'HTTPS candidate; documentation also uses HTTP. Test exact suite/index/file.'
