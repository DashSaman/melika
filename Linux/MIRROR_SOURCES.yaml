schema_version: 1
research_date: '2026-10-17'
# 27 source entries; not 27 independent providers and not verified production routes.
# Source rows override defaults. The loader must apply defaults and validate URLs.
# DOCUMENTED means published coverage, not a successful raw HTTP/in-Iran probe.
defaults:
  routing_enabled: false
  permission_state: unreviewed
  domestic_state: unverified
  failure_domain: null
  suite_map: {}
  allow_http_signed_metadata: false
  measurements:
    raw_probe_at: null
    vantage: null
    http_status: null
    tls_verified: null
    range_verified: null
    full_artifact_hash_verified: null
    metadata_date: null
    valid_until: null
    bytes_retained: null
    rate_limit: null
    outage_test: not_run
sources:
