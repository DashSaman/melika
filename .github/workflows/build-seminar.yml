name: Build seminar review candidate
# The delivered version is frozen. A documentation edit must not replace
# the exact Word/PDF hashes already reviewed in qa/FINAL_QA.json.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
      MPLBACKEND: Agg
    steps:
      - name: Prepare document environment
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv python3-uno libreoffice-writer fonts-noto-core fonts-croscore fonts-dejavu-core poppler-utils
      - uses: actions/checkout@v4
      - name: Build candidate, not a new approved release
        run: |
          python3 -m venv /tmp/melika-build-env
          /tmp/melika-build-env/bin/pip -q install python-docx==1.2.0 matplotlib==3.10.8
          /tmp/melika-build-env/bin/python scripts/build_seminar.py --font-size 11.5
          soffice -env:UserInstallation=file:///tmp/melika-uno-profile --headless --accept='socket,host=localhost,port=2003;urp;StarOffice.ServiceManager' --norestore --nodefault --nofirststartwizard > /tmp/melika-uno.log 2>&1 &
          UNO_PID=$!
          python3 scripts/update_indexes.py artifacts/Personality_and_Suicide_Seminar.fa.docx
          kill "$UNO_PID" || true
          sleep 2
          soffice -env:UserInstallation=file:///tmp/melika-pdf-profile --headless --convert-to pdf --outdir artifacts artifacts/Personality_and_Suicide_Seminar.fa.docx
          pdfinfo artifacts/Personality_and_Suicide_Seminar.fa.pdf > qa/CANDIDATE_PDF_INFO.txt
          printf '%s\n' 'This is a new build candidate. Final QA from an earlier release does not validate its hashes or layout. Review all pages, references and numbers before publishing.' > artifacts/CANDIDATE_REVIEW_REQUIRED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: melika-review-candidate
          path: |
            artifacts/Personality_and_Suicide_Seminar.fa.docx
            artifacts/Personality_and_Suicide_Seminar.fa.pdf
            artifacts/figure_*.png
            artifacts/CANDIDATE_REVIEW_REQUIRED.txt
            qa/CANDIDATE_PDF_INFO.txt
            qa/build_report.json
          retention-days: 30
